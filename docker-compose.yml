services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bison
      POSTGRES_PASSWORD: bison
      POSTGRES_DB: bison
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - bison-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bison -d bison"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bison:bison@db:5432/bison?schema=public
      NODE_ENV: development
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  bison-postgres:
